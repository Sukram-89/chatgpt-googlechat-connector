<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HoboAI Admin</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.4;
      }

      body {
        margin: 0;
        background: #f7f7f4;
        color: #1f2328;
      }

      main {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      header {
        align-items: start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      header p {
        color: #59636e;
        margin-top: 6px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
        gap: 20px;
        align-items: start;
      }

      section {
        background: #fff;
        border: 1px solid #d8dee4;
        border-radius: 8px;
        padding: 18px;
      }

      .section-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .status {
        color: #59636e;
        font-size: 14px;
        margin-top: 4px;
      }

      .form-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 8px;
        margin-bottom: 14px;
      }

      .date-row {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }

      .activity-meta {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      label {
        color: #59636e;
        font-size: 14px;
      }

      input,
      select {
        box-sizing: border-box;
        width: 100%;
        min-height: 38px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
      }

      .wide-section {
        margin-bottom: 20px;
      }

      .main-column {
        display: grid;
        gap: 20px;
      }

      .sidebar {
        position: sticky;
        top: 20px;
      }

      .user-row {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        table-layout: fixed;
      }

      th,
      td {
        border-top: 1px solid #d8dee4;
        padding: 10px 8px;
        text-align: left;
        vertical-align: middle;
        word-break: break-word;
      }

      th {
        color: #59636e;
        font-size: 13px;
        font-weight: 600;
      }

      th:last-child,
      td:last-child {
        width: 92px;
        text-align: right;
      }

      .linkedin-month {
        width: 64px;
      }

      .linkedin-name {
        width: 160px;
      }

      .linkedin-actions {
        display: flex;
        gap: 4px;
        justify-content: flex-end;
        min-width: 160px;
      }

      .linkedin-actions button {
        min-height: 30px;
        padding: 4px 8px;
      }

      button {
        min-height: 38px;
        border: 1px solid #2f6f4e;
        border-radius: 6px;
        background: #2f6f4e;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 8px 12px;
        white-space: nowrap;
      }

      button.secondary {
        border-color: #d0d7de;
        background: #fff;
        color: #1f2328;
      }

      button.danger {
        border-color: #c93c37;
        background: #fff;
        color: #c93c37;
      }

      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .drag-handle {
        cursor: grab;
        color: #59636e;
        font-weight: 700;
        margin-right: 8px;
        user-select: none;
      }

      .drop-target {
        outline: 2px solid #2f6f4e;
        outline-offset: -2px;
      }

      .member-select {
        min-width: 0;
      }

      .activity-panel {
        background: #f8faf8;
        border: 1px solid #d8dee4;
        border-radius: 8px;
        display: grid;
        gap: 10px;
        margin-bottom: 14px;
        padding: 14px;
      }

      .activity-panel-head {
        align-items: center;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .activity-panel-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(160px, 0.7fr) minmax(0, 1fr) auto;
        gap: 8px;
      }

      .activity-panel-grid input,
      .activity-panel-grid select {
        min-width: 0;
      }

      .activity-add-row {
        display: grid;
        gap: 8px;
        grid-template-columns: minmax(0, 1.2fr) minmax(160px, 0.7fr) minmax(0, 1fr) auto;
        margin-bottom: 14px;
      }

      .activity-add-row input,
      .activity-add-row select {
        min-width: 0;
      }

      .activity-input {
        min-width: 0;
      }

      .list-actions {
        display: flex;
        justify-content: center;
        margin-top: 12px;
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }
      }

      @media (max-width: 560px) {
        main {
          width: min(100% - 20px, 1100px);
          padding-top: 18px;
        }

        section {
          padding: 14px;
        }

        .section-head,
        .user-row,
        .form-row,
        .activity-panel-head,
        .activity-add-row,
        .activity-panel-grid,
        .date-row {
          grid-template-columns: 1fr;
        }

        .section-head {
          display: grid;
        }

        header {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>HoboAI Admin</h1>
          <p>Manage LinkedIn and activity rotations.</p>
        </div>
        <div class="actions">
          <button class="secondary" onclick="sendHoursReminder()">
            Send hours reminder
          </button>
          <button onclick="sendSchedulerMessage('monthly')">
            Send both test messages
          </button>
        </div>
      </header>

      <div class="grid">
        <div class="main-column">
        <section>
          <div class="section-head">
            <div>
              <h2>LinkedIn Rotation</h2>
              <p class="status" id="linkedinStatus">Loading...</p>
            </div>
            <div class="actions">
              <button class="secondary" onclick="sendSchedulerMessage('linkedin')">
                Send test message
              </button>
              <button onclick="saveRotation('linkedin')">Save</button>
            </div>
          </div>

          <div class="form-row">
            <select id="linkedinUser"></select>
            <button class="secondary" onclick="addMember('linkedin')">Add</button>
          </div>

          <table>
            <thead>
              <tr>
                <th class="linkedin-name">Name</th>
                <th class="linkedin-month">Month</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="linkedinMembers"></tbody>
          </table>
          <div class="list-actions">
            <button class="secondary" onclick="toggleRotationList('linkedin')" id="linkedinToggle">
              Show next 5
            </button>
          </div>
        </section>

        <section>
          <div class="section-head">
            <div>
              <h2>Activity Rotation</h2>
              <p class="status" id="activityStatus">Loading...</p>
            </div>
            <div class="actions">
              <button class="secondary" onclick="sendSchedulerMessage('activity')">
                Send test message
              </button>
              <button onclick="saveRotation('activity')">Save</button>
            </div>
          </div>

          <div class="activity-panel">
            <div class="activity-panel-head">
              <strong>Activity details</strong>
              <span class="status" id="activityMetaStatus">Loading...</span>
            </div>
            <div class="activity-add-row">
              <input id="activityAddName" placeholder="Activity name">
              <input id="activityAddDate" type="date">
              <select id="activityUser"></select>
              <button class="secondary" onclick="addMember('activity')">Add</button>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Assigned</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="activityMembers"></tbody>
          </table>
        </section>
        </div>

        <section class="wide-section sidebar">
          <div class="section-head">
            <div>
              <h2>Users</h2>
              <p class="status" id="usersStatus">Loading...</p>
            </div>
          </div>

          <div class="form-row user-row">
            <input id="userName" placeholder="Display name">
            <input id="userEmail" placeholder="Email" required>
            <input id="userChatId" placeholder="Chat user id (optional)">
            <button class="secondary" onclick="saveUser()">Add user</button>
          </div>

          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Chat ID</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="usersTable"></tbody>
          </table>
        </section>
      </div>
    </main>

    <script>
      const state = {
        users: [],
        linkedin: { members: [], current: null, next: null },
        activity: {
          members: [],
          current: null,
          next: null,
          activityDate: "",
          activityName: ""
        },
        linkedinExpanded: false,
      };

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function setStatus(type, text) {
        document.getElementById(`${type}Status`).innerText = text;
      }

      function setActivityMetaStatus(text) {
        const node = document.getElementById("activityMetaStatus");

        if (node) {
          node.innerText = text;
        }
      }

      function getStatusText(type) {
        const rotation = state[type];
        const current = rotation.current ? getMemberLabel(rotation.current) : "n/a";
        const next = rotation.next ? getMemberLabel(rotation.next) : "n/a";
        if (type === "activity") {
          return `Current: ${current} | Next: ${next}`;
        }

        return `Current: ${current} | Next: ${next}`;
      }

      function getUser(userId) {
        return state.users.find((user) => user.id === userId);
      }

      function getMemberLabel(member) {
        const user = member.userId ? getUser(member.userId) : null;
        return user?.displayName || member.displayName || "Unknown user";
      }

      function getMemberEmail(member) {
        const user = member.userId ? getUser(member.userId) : null;
        return user?.email || member.email || "";
      }

      function getMemberUserId(member) {
        const user = member.userId ? getUser(member.userId) : null;
        return user?.id || member.userId || "";
      }

      function getMemberOptions(selectedUserId) {
        return [
          '<option value="">Select user</option>',
          ...state.users.map(
            (user) =>
              `<option value="${escapeHtml(user.id)}"${
                user.id === selectedUserId ? " selected" : ""
              }>${escapeHtml(user.displayName)}</option>`
          )
        ].join("");
      }

      function getMonthName(index) {
        return new Intl.DateTimeFormat("en", { month: "long" }).format(
          new Date(2026, index, 1)
        );
      }

      function getVisibleLinkedInMembers(rotation) {
        const members = rotation.members || [];

        if (!members.length) {
          return [];
        }

        const startIndex = new Date().getMonth() % members.length;
        const ordered = members
          .slice(startIndex)
          .concat(members.slice(0, startIndex));

        return ordered.map((member, visibleIndex) => ({
          member,
          actualIndex: (startIndex + visibleIndex) % members.length,
          monthLabel: getMonthName((new Date().getMonth() + visibleIndex) % 12)
        }));
      }

      function getSortedActivityMembers(rotation) {
        return (rotation.members || [])
          .map((member, index) => ({
            member,
            actualIndex: index,
            sortDate: member.activityDate || "",
            sortName: member.activityName || "",
            sortIndex: index
          }))
          .sort((a, b) => {
            const aHasDate = Boolean(a.sortDate);
            const bHasDate = Boolean(b.sortDate);

            if (aHasDate !== bHasDate) {
              return aHasDate ? -1 : 1;
            }

            if (a.sortDate !== b.sortDate) {
              return a.sortDate.localeCompare(b.sortDate);
            }

            if (a.sortName !== b.sortName) {
              return a.sortName.localeCompare(b.sortName);
            }

            return a.sortIndex - b.sortIndex;
          });
      }

      function syncMemberFromUser(member) {
        const user = member.userId ? getUser(member.userId) : null;

        if (!user) {
          return member;
        }

        return {
          userId: user.id,
          displayName: user.displayName,
          ...(user.chatUserId ? { chatUserId: user.chatUserId } : {}),
          ...(user.email ? { email: user.email } : {}),
          ...(typeof member.activityName === "string" && member.activityName.trim()
            ? { activityName: member.activityName.trim() }
            : {}),
          ...(typeof member.activityDate === "string" && member.activityDate.trim()
            ? { activityDate: member.activityDate.trim() }
            : {})
        };
      }

      function moveRotationMember(type, fromIndex, toIndex) {
        if (fromIndex === toIndex || toIndex < 0) {
          return;
        }

        const members = state[type].members;

        if (toIndex >= members.length) {
          return;
        }

        const [moved] = members.splice(fromIndex, 1);
        members.splice(toIndex, 0, moved);
        renderRotation(type);
      }

      function moveLinkedInMember(index, direction) {
        const targetIndex = index + direction;

        if (targetIndex < 0 || targetIndex >= state.linkedin.members.length) {
          return;
        }

        moveRotationMember("linkedin", index, targetIndex);
      }

      function renderUserSelects() {
        const options = [
          '<option value="">Select user</option>',
          ...state.users.map(
            (user) =>
              `<option value="${escapeHtml(user.id)}">${escapeHtml(user.displayName)}</option>`
          )
        ].join("");

        document.getElementById("linkedinUser").innerHTML = options;
        document.getElementById("activityUser").innerHTML = options;
      }

      function renderUsers() {
        document.getElementById("usersStatus").innerText = `${state.users.length} users`;
        renderUserSelects();

        document.getElementById("usersTable").innerHTML = state.users
          .map(
            (user) => `
              <tr>
                <td>${escapeHtml(user.displayName)}</td>
                <td>${escapeHtml(user.email || "")}</td>
                <td>${escapeHtml(user.chatUserId || "")}</td>
                <td>
                  <button class="danger" onclick="deleteUser('${escapeHtml(user.id)}')">
                    Remove
                  </button>
                </td>
              </tr>
            `
          )
          .join("");
      }

      async function sendSchedulerMessage(type) {
        if (type === "monthly") {
          setStatus("linkedin", "Sending test message...");
          setStatus("activity", "Sending test message...");
        } else {
          setStatus(type, "Sending test message...");
        }

        const response = await fetch(`/scheduler/${type}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });

        if (!response.ok) {
          if (type === "monthly") {
            setStatus("linkedin", "Test message failed.");
            setStatus("activity", "Test message failed.");
          } else {
            setStatus(type, "Test message failed.");
          }
          return;
        }

        const result = await response.json();

        if (type === "monthly") {
          const delivered = result.spaceNotification?.delivered;

          renderRotation("linkedin");
          renderRotation("activity");
          setStatus(
            "linkedin",
            `${getStatusText("linkedin")} | ${
              delivered ? "Combined test sent" : "Combined test not delivered"
            }`
          );
          setStatus(
            "activity",
            `${getStatusText("activity")} | ${
              delivered ? "Combined test sent" : "Combined test not delivered"
            }`
          );
          return;
        }

        const delivered = result.spaceNotification?.delivered;

        renderRotation(type);
        setStatus(
          type,
          `${getStatusText(type)} | ${delivered ? "Test sent" : "Test not delivered"}`
        );
      }

      async function sendHoursReminder() {
        document.getElementById("usersStatus").innerText = "Sending hours reminder...";

        const response = await fetch("/scheduler/hours-reminder?force=true", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });

        if (!response.ok) {
          document.getElementById("usersStatus").innerText =
            "Hours reminder failed.";
          return;
        }

        const result = await response.json();
        document.getElementById("usersStatus").innerText =
          result.spaceNotification?.delivered
            ? `${state.users.length} users | Hours reminder sent: ${result.message}`
            : `${state.users.length} users | Hours reminder not delivered: ${
                result.message || result.error || "unknown error"
              }`;
      }

      function recomputeRotation(type) {
        const rotation = state[type];
        const now = new Date();
        const members = rotation.members || [];

        if (!members.length) {
          rotation.current = null;
          rotation.next = null;
          return;
        }

        const index = (now.getFullYear() * 12 + now.getMonth()) % members.length;
        rotation.current = members[index];
        rotation.next = members[(index + 1) % members.length];
      }

      function renderRotation(type) {
        recomputeRotation(type);

        const rotation = state[type];
        setStatus(type, getStatusText(type));

        const displayMembers =
          type === "linkedin"
            ? getVisibleLinkedInMembers(rotation)
            : getSortedActivityMembers(rotation);

        if (type === "activity") {
          const firstActivity = displayMembers[0]?.member || null;
          setActivityMetaStatus(
            `${firstActivity?.activityName || "Activity"} on ${
              firstActivity?.activityDate || "TBD"
            }`
          );
        }

        const visibleMembers =
          type === "linkedin" && !state.linkedinExpanded
            ? displayMembers.slice(0, Math.min(5, displayMembers.length))
            : displayMembers;

        const rows =
          type === "activity"
            ? visibleMembers
                .map(
                  ({ member, actualIndex }) => `
                    <tr>
                      <td><input class="activity-input" value="${escapeHtml(
                        member.activityName || ""
                      )}" oninput="updateActivityMemberField(${actualIndex}, 'activityName', this.value)"></td>
                      <td><input class="activity-input" type="date" value="${escapeHtml(
                        member.activityDate || ""
                      )}" oninput="updateActivityMemberField(${actualIndex}, 'activityDate', this.value)"></td>
                      <td>
                        <select
                          class="member-select"
                          onchange="updateActivityMember(${actualIndex}, this.value)"
                        >
                          ${getMemberOptions(getMemberUserId(member))}
                        </select>
                      </td>
                      <td>
                        <button class="danger" onclick="removeMember('${type}', ${actualIndex})">
                          Remove
                        </button>
                      </td>
                    </tr>
                  `
                )
                .join("")
            : visibleMembers
                .map(
                  ({ member, actualIndex, monthLabel }) => `
                    <tr>
                      <td>${escapeHtml(member.displayName)}</td>
                      <td>${escapeHtml(monthLabel)}</td>
                      <td>
                        <div class="linkedin-actions">
                          <button class="secondary" onclick="moveLinkedInMember(${actualIndex}, -1)" ${
                            actualIndex === 0 ? "disabled" : ""
                          }>↑</button>
                          <button class="secondary" onclick="moveLinkedInMember(${actualIndex}, 1)" ${
                            actualIndex === rotation.members.length - 1 ? "disabled" : ""
                          }>↓</button>
                          <button class="danger" onclick="removeMember('linkedin', ${actualIndex})">
                            Remove
                          </button>
                        </div>
                      </td>
                    </tr>
                  `
                )
                .join("");

        document.getElementById(`${type}Members`).innerHTML = rows;

        if (type === "linkedin") {
          const toggle = document.getElementById("linkedinToggle");
          if (toggle) {
            toggle.innerText = state.linkedinExpanded ? "Collapse" : "Show next 5";
          }
        }
      }

      async function loadUsers() {
        const response = await fetch("/api/users");

        if (!response.ok) {
          throw new Error("Could not load users");
        }

        state.users = await response.json();
        renderUsers();
      }

      async function loadRotation(type) {
        const response = await fetch(`/api/${type}-rotation`);

        if (!response.ok) {
          throw new Error(`Could not load ${type} rotation`);
        }

        const rotation = await response.json();
        state[type] = {
          members: (rotation.members || []).map(syncMemberFromUser),
          current: rotation.current || null,
          next: rotation.next || null,
          activityDate: rotation.activityDate || "",
          activityName: rotation.activityName || ""
        };

        if (type === "activity") {
          const activityNameInput = document.getElementById("activityAddName");
          const activityDateInput = document.getElementById("activityAddDate");

          if (activityNameInput) {
            activityNameInput.value = state.activity.activityName || "";
          }

          if (activityDateInput) {
            activityDateInput.value = state.activity.activityDate || "";
          }
        }

        renderRotation(type);
      }

      function addMember(type) {
        const userSelect = document.getElementById(`${type}User`);
        const user = getUser(userSelect.value);

        if (!user) {
          userSelect.focus();
          return;
        }

        if (type === "activity") {
          const activityNameInput = document.getElementById("activityAddName");
          const activityDateInput = document.getElementById("activityAddDate");

          state[type].members.push(
            syncMemberFromUser({
              userId: user.id,
              activityName: activityNameInput.value.trim(),
              activityDate: activityDateInput.value.trim()
            })
          );

          if (activityNameInput) {
            activityNameInput.value = "";
          }

          if (activityDateInput) {
            activityDateInput.value = "";
          }

          userSelect.value = "";
          renderRotation(type);
          return;
        }

        state[type].members.push(syncMemberFromUser({ userId: user.id }));

        userSelect.value = "";
        renderRotation(type);
      }

      function updateActivityMember(index, userId) {
        const user = getUser(userId);

        if (!user) {
          return;
        }

        state.activity.members[index] = syncMemberFromUser({ userId: user.id });
        renderRotation("activity");
      }

      function updateActivityMemberField(index, field, value) {
        const member = state.activity.members[index];

        if (!member) {
          return;
        }

        state.activity.members[index] = {
          ...member,
          [field]: value
        };

        renderRotation("activity");
      }

      function removeMember(type, index) {
        state[type].members.splice(index, 1);
        renderRotation(type);
      }

      function toggleRotationList(type) {
        if (type !== "linkedin") {
          return;
        }

        state.linkedinExpanded = !state.linkedinExpanded;
        renderRotation("linkedin");
      }

      async function saveRotation(type) {
        const payload = {
          members: state[type].members.map(syncMemberFromUser)
        };

        if (type === "activity") {
          payload.activityName = state.activity.members[0]?.activityName || "";
          payload.activityDate = state.activity.members[0]?.activityDate || "";
        }

        setStatus(type, "Saving...");

        const response = await fetch(`/api/${type}-rotation`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          setStatus(type, "Save failed.");
          return;
        }

        const rotation = await response.json();
        state[type] = {
          members: (rotation.members || []).map(syncMemberFromUser),
          current: rotation.current || null,
          next: rotation.next || null,
          activityDate: rotation.activityDate || "",
          activityName: rotation.activityName || ""
        };

        renderRotation(type);
      }

      async function saveUser() {
        const displayNameInput = document.getElementById("userName");
        const emailInput = document.getElementById("userEmail");
        const payload = {
          displayName: displayNameInput.value.trim(),
          email: emailInput.value.trim(),
          chatUserId: document.getElementById("userChatId").value.trim()
        };

        if (!payload.displayName) {
          displayNameInput.focus();
          return;
        }

        if (!payload.email) {
          emailInput.focus();
          return;
        }

        document.getElementById("usersStatus").innerText = "Saving...";

        const response = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          document.getElementById("usersStatus").innerText = "Save failed.";
          return;
        }

        document.getElementById("userName").value = "";
        document.getElementById("userEmail").value = "";
        document.getElementById("userChatId").value = "";
        await loadUsers();
        renderRotation("linkedin");
        renderRotation("activity");
      }

      async function deleteUser(userId) {
        document.getElementById("usersStatus").innerText = "Deleting...";

        const response = await fetch(`/api/users/${encodeURIComponent(userId)}`, {
          method: "DELETE"
        });

        if (!response.ok) {
          document.getElementById("usersStatus").innerText = "Delete failed.";
          return;
        }

        state.linkedin.members = state.linkedin.members.filter(
          (member) => member.userId !== userId
        );
        state.activity.members = state.activity.members.filter(
          (member) => member.userId !== userId
        );

        await loadUsers();
        renderRotation("linkedin");
        renderRotation("activity");
      }

      loadUsers()
        .then(() =>
          Promise.all([
            loadRotation("linkedin").catch(() =>
              setStatus("linkedin", "Could not load LinkedIn rotation.")
            ),
            loadRotation("activity").catch(() =>
              setStatus("activity", "Could not load activity rotation.")
            )
          ])
        )
        .catch(() => {
          document.getElementById("usersStatus").innerText = "Could not load users.";
        });

    </script>
  </body>
</html>
