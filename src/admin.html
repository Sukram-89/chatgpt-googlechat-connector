<!doctype html><html><head><title>HoboAI Admin</title><style>body{font-family:sans-serif;padding:24px;max-width:1000px}section{border:1px solid #ddd;padding:16px;margin-bottom:24px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid #ddd;padding:8px}input,button{padding:8px;margin:4px}</style></head><body><h1>HoboAI Admin</h1><p>Manage LinkedIn and Activity rotations.</p><section><h2>LinkedIn Rotation</h2><div id='linkedinStatus'>Loading...</div><input id='linkedinName' placeholder='Display name'><input id='linkedinChatId' placeholder='Chat user id'><button onclick='addLinkedInMember()'>Add Member</button><table><thead><tr><th>Name</th><th>Chat ID</th></tr></thead><tbody id='linkedinMembers'></tbody></table></section><section><h2>Activity Rotation</h2><div id='activityStatus'>Loading...</div><input id='activityDate' placeholder='2026-06-15'><br><input id='activityName' placeholder='Display name'><input id='activityChatId' placeholder='Chat user id'><button onclick='addActivityMember()'>Add Member</button><table><thead><tr><th>Name</th><th>Chat ID</th></tr></thead><tbody id='activityMembers'></tbody></table></section><script>async function load(){try{const l=await fetch('/api/linkedin-rotation').then(r=>r.json());document.getElementById('linkedinStatus').innerText='Current: '+(l.current?.displayName||'n/a')+' | Next: '+(l.next?.displayName||'n/a');document.getElementById('linkedinMembers').innerHTML=(l.members||[]).map(m=>`<tr><td>${m.displayName}</td><td>${m.chatUserId||''}</td></tr>`).join('');}catch{} try{const a=await fetch('/api/activity-rotation').then(r=>r.json());document.getElementById('activityStatus').innerText='Current: '+(a.current?.displayName||'n/a')+' | Next: '+(a.next?.displayName||'n/a')+' | Date: '+(a.activityDate||'TBD');document.getElementById('activityDate').value=a.activityDate||'';document.getElementById('activityMembers').innerHTML=(a.members||[]).map(m=>`<tr><td>${m.displayName}</td><td>${m.chatUserId||''}</td></tr>`).join('');}catch{}}</script></body></html>
